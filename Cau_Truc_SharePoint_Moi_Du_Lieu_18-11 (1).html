<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cấu trúc SharePoint mới</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: header summary → toolbar → two columns (tree | detail panel), stacks on phone */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#14232b; --muted:#5b6b73; --line:#dde4e7;
  --accent:#0f6e74; --accent-soft:#e2f1f1;
  --draw:#a8620a; --draw-soft:#fbf0de;
  --arch:#6a7480; --arch-soft:#eceff2;
  --hover:#eef3f4;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --panel:#162124; --fg:#e3ecee; --muted:#93a4aa; --line:#27363a;
  --accent:#4fc0c5; --accent-soft:#16383a; --draw:#e8a94c; --draw-soft:#3a2b14;
  --arch:#9aa4ae; --arch-soft:#232c32; --hover:#1d2a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --panel:#162124; --fg:#e3ecee; --muted:#93a4aa; --line:#27363a;
  --accent:#4fc0c5; --accent-soft:#16383a; --draw:#e8a94c; --draw-soft:#3a2b14;
  --arch:#9aa4ae; --arch-soft:#232c32; --hover:#1d2a2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.02em;word-break:break-all}
h1{font-size:28px;line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
.lead{color:var(--muted);margin:0;max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:6px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
button{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{background:var(--hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;overflow-x:auto}
ul{list-style:none;margin:0;padding:0}
ul ul{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px}
.row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;user-select:none}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft)}
.car{width:14px;flex:none;color:var(--muted);font-size:11px;text-align:center;transition:transform .15s}
li.open>.row .car{transform:rotate(90deg)}
li:not(.open)>ul{display:none}
.ico{width:16px;height:13px;flex:none;border-radius:2px 3px 3px 3px;background:var(--accent);opacity:.85;position:relative}
.ico::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:4px;border-radius:2px 2px 0 0;background:inherit}
.k-draw .ico{background:var(--draw)} .k-arch .ico{background:var(--arch)} .k-sample .ico{background:transparent;border:1.5px dashed var(--accent)}
.k-sample .ico::before{display:none}
.nm{font-family:var(--f-mono);font-size:13.5px;font-weight:500}
.lvl1>.row .nm{font-weight:600}
.note{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:12px}
.hit .nm{background:var(--draw-soft);border-radius:3px}
.hidden{display:none}
li.zero>.row{opacity:.4}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:820px){aside{position:static}}
aside .path{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
aside h2{margin:0;font-family:var(--f-mono);font-size:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.draw{background:var(--draw-soft);color:var(--draw)} .tag.arch{background:var(--arch-soft);color:var(--arch)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
dd{margin:0;min-width:0}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);padding:2px 6px;border-radius:4px;word-break:break-all}
.from{display:flex;flex-direction:column;gap:4px;margin:0;padding:0}
.from li{font-size:13.5px}
.from li::before{content:"← ";color:var(--muted)}
.rules{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.rules b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.car{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Data The Sentry › Documents › bản gán thử theo dữ liệu ngày 18/11/2026</div>
    <h1>Cấu trúc thư mục SharePoint mới</h1>
   <div class="stats" id="stats"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--accent)"></i>Thư mục làm việc</span>

      <span><i class="sw" style="background:var(--arch)"></i>Lưu trữ trước 2025</span>
      <span><i class="sw" style="border:1.5px dashed var(--accent)"></i>Nhánh mẫu</span>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Tìm thư mục, ví dụ TSP hoặc ARC" aria-label="Tìm thư mục">

    <button id="openL1" type="button">Chỉ cấp 1–2</button>

  </div>

  <div class="grid">
    <nav class="tree" aria-label="Cây thư mục"><ul id="tree"></ul></nav>
    <aside id="detail" aria-live="polite"></aside>
  </div>
</div>

const DEFAULT_PATTERN = "DDMMYY_MÃ_Mô-tả_vXX";
const fmt=(x)=>x.toLocaleString("vi-VN",{maximumFractionDigits:x<10?2:1});
let id=0; const byId={};
function count(n){return (n.children||[]).reduce((s,c)=>s+1+count(c),0)}
function build(nodes, parentEl, path, depth, inherit){
  nodes.forEach(n=>{
    const node={...n, id:++id, path:[...path,n.name], depth,
      agg:AGG[[...path,n.name].slice(1).join("|")]||null,
      kind:n.kind||inherit.kind||"", owner:n.owner||inherit.owner,
      pattern:n.pattern||inherit.pattern, from:n.from||null, top:inherit.top||n};
    byId[node.id]=node;
    const li=document.createElement("li");
    li.className=(depth===1?"lvl1 ":"")+(node.kind?"k-"+node.kind:"");
    li.dataset.id=node.id;
    const kids=n.children||[];
    const row=document.createElement("div"); row.className="row"; row.tabIndex=0;
    row.setAttribute("role","treeitem"); if(kids.length) row.setAttribute("aria-expanded","false");
    row.innerHTML=`<span class="car">${kids.length?"▶":""}</span><span class="ico"></span>
      <span class="nm"></span><span class="note"></span><span class="cnt">${node.agg&&node.agg.gb>=0.005?fmt(node.agg.gb)+" GB":(kids.length?count(n):"")}</span>`;
    if(depth>=2&&!node.agg&&n.kind!=="sample"&&AGG[path.slice(1).join("|")]) li.classList.add("zero");
    row.querySelector(".nm").textContent=n.name;
    row.querySelector(".note").textContent=depth<=2||n.kind==="sample"||n.show?(n.note||""):"";
    li.appendChild(row);
    if(kids.length){const ul=document.createElement("ul"); li.appendChild(ul);
      build(kids, ul, node.path, depth+1, {kind:node.kind, owner:node.owner, pattern:node.pattern, top:node.top});}
    parentEl.appendChild(li);
  });
}
const treeEl=document.getElementById("tree");
build(TREE, treeEl, ["Data The Sentry"], 1, {});

const TOT=(()=>{let gb=0,f=0,old=0;for(const k in AGG){if(k.includes("|"))continue;if(k[0]==="_")continue;gb+=AGG[k].gb;f+=AGG[k].f;old+=AGG[k].old}return {gb,f,old}})();
const total=Object.keys(byId).length;

function setOpen(li,open){li.classList.toggle("open",open);
  const r=li.querySelector(":scope>.row"); if(r.hasAttribute("aria-expanded")) r.setAttribute("aria-expanded",open)}
function allLis(){return [...treeEl.querySelectorAll("li")]}
function show(nid){
  const n=byId[nid]; treeEl.querySelectorAll(".row.sel").forEach(r=>r.classList.remove("sel"));
  treeEl.querySelector(`li[data-id="${nid}"]>.row`).classList.add("sel");
  const tag=n.kind==="draw"?'<span class="tag draw">Khu bản vẽ</span>':n.kind==="arch"?'<span class="tag arch">Lưu trữ – chỉ đọc</span>':n.kind==="ro"?'<span class="tag arch">Chỉ đọc sau bàn giao</span>':n.kind==="sample"?'<span class="tag">Nhánh mẫu</span>':'<span class="tag">Cấp '+n.depth+'</span>';
  const pat=n.pattern||DEFAULT_PATTERN;
  const ex=n.example||n.top.example||(n.kind==="arch"?"120623_TSP_Proposal-XYZ_v03.pdf":"231026_TSP_Proposal-ABC-Corp_v02.pdf");
  const a=n.agg; const from=n.from||n.top.from;
  const srcs=a&&a.src&&a.src.some(x=>x[1]>=0.01)?a.src.filter(x=>x[1]>=0.01).map(x=>x[0]+"  ·  "+fmt(x[1])):from;
  const yrs=a&&a.yr?Object.entries(a.yr).filter(e=>e[1]>=0.05):[];
  const d=document.getElementById("detail");
  d.innerHTML=`<div class="path"></div><h2></h2><div>${tag}</div>
   <dl><dt>Nội dung</dt><dd class="x-note"></dd><dt>Phụ trách</dt><dd class="x-owner"></dd>
   <dt>Tên file</dt><dd><code class="x-pat"></code></dd><dt>Ví dụ</dt><dd><code class="x-ex"></code></dd>
   ${a?`<dt>Hiện có</dt><dd>${a.f.toLocaleString("vi-VN")} file · ${fmt(a.gb)} GB · ${a.d.toLocaleString("vi-VN")} thư mục</dd>`:""}
   ${a&&a.old>0?`<dt>Trước 2025</dt><dd>${fmt(a.old)} GB → 99_ARCHIVE</dd>`:""}
   ${yrs.length?`<dt>Theo năm sửa</dt><dd class="x-yrs"></dd>`:""}</dl>
   ${srcs&&srcs.length?`<div><dt style="margin-bottom:6px">Thư mục cũ chuyển vào${a?" (GB)":""}</dt><ul class="from"></ul></div>`:""}
   <div class="rules">${n.kind==="ro"?'<div><b>Chỉ đọc:</b> hồ sơ bàn giao ban đầu / khách cũ ở chế độ chỉ đọc; chỉ Trưởng BQL hoặc người được giao mới có quyền sửa, xóa.</div>':""}${n.path.includes("SON")&&n.depth>=4?'<div><b>Sonatus:</b> nhánh này theo cây hồ sơ BQL tòa nhà; tên thư mục cố định, không thêm chủ đề mới nếu chưa báo IT.</div>':""}<div><b>Cấp 1–2</b> chỉ IT tạo. Team tạo từ cấp Năm trở xuống.</div>
   <div><b>Không dùng</b> dấu tiếng Việt trong tên thư mục, ký tự # % &amp;, chữ final / copy / (1), thư mục theo tên người, file lẻ ở cấp 1–2.</div>
   <div><b>Giới hạn</b> tối đa 5 cấp thư mục, đường dẫn dưới 250 ký tự (riêng nhánh SON theo cây BQL có thể sâu hơn, giữ tên ngắn).</div>
   <div><b>Di chuyển</b> bằng Move to trên SharePoint web để giữ lịch sử phiên bản.</div></div>`;
  d.querySelector(".path").textContent=n.path.join(" / ");
  d.querySelector("h2").textContent=n.name;
  d.querySelector(".x-note").textContent=n.note||"—";
  d.querySelector(".x-owner").textContent=n.owner||"—";
  d.querySelector(".x-pat").textContent=pat;
  d.querySelector(".x-ex").textContent=ex;
  if(srcs&&srcs.length){const ul=d.querySelector(".from"); srcs.forEach(f=>{const li=document.createElement("li");li.textContent=f;ul.appendChild(li)})}
  if(yrs.length) d.querySelector(".x-yrs").textContent=yrs.map(e=>e[0]+": "+fmt(e[1])).join(" · ")+" GB";
}
treeEl.addEventListener("click",e=>{const row=e.target.closest(".row"); if(!row) return;
  const li=row.parentElement; if(li.querySelector(":scope>ul")) setOpen(li,!li.classList.contains("open")); show(li.dataset.id)});
treeEl.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.click()}});
document.getElementById("openAll").onclick=()=>allLis().forEach(li=>setOpen(li,true));
document.getElementById("closeAll").onclick=()=>allLis().forEach(li=>setOpen(li,false));
const openL1=()=>allLis().forEach(li=>setOpen(li,byId[li.dataset.id].depth===1));
document.getElementById("openL1").onclick=openL1;

document.getElementById("q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  allLis().forEach(li=>{li.classList.remove("hidden","hit")});
  if(!q){openL1();return}
  allLis().reverse().forEach(li=>{const n=byId[li.dataset.id];
    const self=(n.name+" "+(n.note||"")).toLowerCase().includes(q);
    const kid=[...li.querySelectorAll(":scope>ul>li")].some(c=>!c.classList.contains("hidden"));
    li.classList.toggle("hit",self); li.classList.toggle("hidden",!self&&!kid); setOpen(li,kid)});
});

openL1();
setOpen(treeEl.querySelector('li[data-id]'),true);
const tsp=Object.values(byId).find(n=>n.name==="10-2026_Proposals");
tsp.path.slice(1,-1).reduce((el,name)=>{const li=[...el.querySelectorAll(":scope>li")].find(l=>byId[l.dataset.id].name===name);setOpen(li,true);return li.querySelector(":scope>ul")},treeEl);
const sonOps=Object.values(byId).find(n=>n.name==="00_Ban-giao-ban-dau"&&n.path.includes("60_OPERATIONS"));
sonOps.path.slice(1).reduce((el,name)=>{const li=[...el.querySelectorAll(":scope>li")].find(l=>byId[l.dataset.id].name===name);setOpen(li,true);return li.querySelector(":scope>ul")},treeEl);
show(sonOps.id);
